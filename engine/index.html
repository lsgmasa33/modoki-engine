<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Modoki</title>
    <script>
      // Fatal-load guard (robust auto-open). A project's game code loads against THIS
      // editor's engine at startup (main.tsx → App.tsx → virtual:modoki-games → the
      // project's game.ts → …, plus deeper dynamic imports as the scene runs). If a
      // module fails to evaluate — e.g. a project authored on a NEWER engine that
      // exports a trait this build lacks (the cross-branch skew that white-screened
      // the editor) — the error can fire before OR after React mounts, and it isn't a
      // render error an ErrorBoundary can catch. This inline handler (registered before
      // the module script) watches for module-load errors and, if #root is STILL empty
      // a beat later (the app never rendered), swaps the blank page for an actionable
      // message. The debounce avoids false positives from a transient mid-mount error.
      (function () {
        var shown = false, scheduled = false;
        function isLoadError(msg) {
          return /does not provide an export|Failed to fetch dynamically imported|Importing a module script failed|error loading dynamically imported|Unable to resolve|Cannot find module|SyntaxError|Unexpected (token|identifier|end)/i.test(msg || '');
        }
        // The RELOAD-RECOVERABLE subset: a packaged editor optimizes @modoki/engine, and
        // opening a project can make Vite re-optimize mid-session (a game imports a subpath
        // — e.g. runtime/rendering — the editor's own startup graph didn't). That rehashes
        // the dep chunks, so the already-loaded `runtime.js?v=<old>` throws "does not provide
        // an export". Vite has ALREADY written the new chunk by the time this fires, so a
        // single reload fetches it and recovers — no manual Reload click needed. (A genuine
        // version mismatch re-errors on reload; the rate-limit below then shows the screen.)
        function isReloadRecoverable(msg) {
          return /does not provide an export|Failed to fetch dynamically imported|error loading dynamically imported/i.test(msg || '');
        }
        function tryAutoReloadOnce(msg) {
          if (!isReloadRecoverable(msg)) return false;
          try {
            var KEY = 'modoki-optimize-reload-ts';
            var last = +(sessionStorage.getItem(KEY) || 0);
            var now = Date.now();
            // If we auto-reloaded within the last 5s and still hit this, the reload didn't
            // fix it (real mismatch, not stale optimize) — stop looping, show the screen.
            if (now - last < 5000) return false;
            sessionStorage.setItem(KEY, String(now));
            setTimeout(function () { location.reload(); }, 300); // let the re-optimize finish writing
            return true;
          } catch (_) { return false; }
        }
        function renderFallback(detail) {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
            'font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;background:#1a1a24;color:#ddd;padding:24px;">' +
            '<div style="max-width:520px;text-align:left;">' +
            '<div style="font-size:20px;font-weight:600;margin-bottom:10px;color:#fff;">Couldn’t open this project</div>' +
            '<div style="font-size:13px;line-height:1.55;color:#bbb;margin-bottom:14px;">' +
            'A game component failed to load with this editor. The project may target a <b>newer engine version</b> ' +
            'than this editor build. Update the editor (or this build’s engine), or open a different project via ' +
            'the <b>File ▸ Open Project</b> menu.</div>' +
            '<div style="font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#c98;background:#241c1c;' +
            'border:1px solid #4a3030;border-radius:5px;padding:8px 10px;margin-bottom:16px;white-space:pre-wrap;word-break:break-word;">' +
            String(detail).replace(/^Uncaught\s+/, '').slice(0, 300).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) + '</div>' +
            '<button id="modoki-reload" style="font-size:13px;padding:7px 16px;border-radius:5px;border:1px solid #3a6a3a;' +
            'background:#2a4a2a;color:#dfe;cursor:pointer;">Reload</button></div></div>';
          var btn = document.getElementById('modoki-reload');
          if (btn) btn.addEventListener('click', function () { location.reload(); });
        }
        function consider(msg) {
          try {
            if (shown || scheduled) return;
            if (!isLoadError(msg)) return;
            var root = document.getElementById('root');
            if (!root || root.childElementCount > 0) return; // app already rendered → not fatal
            // Recover transparently from a mid-session dep re-optimize before falling back
            // to the manual screen. If the reload is rate-limited (already tried), continue.
            if (tryAutoReloadOnce(msg)) { scheduled = true; return; }
            scheduled = true;
            // The app may still be mid-mount; only a root that's STILL empty is fatal.
            setTimeout(function () {
              var r = document.getElementById('root');
              if (shown || !r || r.childElementCount > 0) return; // recovered
              shown = true;
              renderFallback(msg);
            }, 1400);
          } catch (_) { /* never let the guard itself throw */ }
        }
        window.addEventListener('error', function (e) { consider(e && (e.message || (e.error && e.error.message))); });
        window.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; consider(r && (r.message || String(r))); });
      })();
    </script>
    <!-- modoki:early-console:start -->
    <script>
      // Early console capture (#633). The ONE thing that cannot be outrun by chunk emission:
      // rolldown inlines main.tsx's side-effect imports into the entry chunk's BODY, which by ES
      // semantics runs after every static import — so `installConsoleRing`'s carefully chosen
      // position above `./App.tsx` buys nothing in a bundled build, and a top-level log in a
      // game's own module graph is lost. Measured on a --target web build of games/sling.
      //
      // This records raw args into a bounded array and forwards. `installConsoleRing()` DRAINS it
      // (runtime/core/consoleRing.ts) and DISARMS it.
      //
      // ⚠️ IT MUST NEVER RESTORE THE ORIGINAL console.* — by drain time `installGlobalErrorHandlers`
      // has already wrapped AROUND this shim, so reassigning console.* would clobber that wrapper
      // and silently kill Crashlytics console reporting. Disarm (stop recording, keep forwarding)
      // is the only safe teardown.
      //
      // Stripped from any build where the ring is not installed — see engine/plugins/earlyConsoleShim.ts.
      (function () {
        var CAP = 256;
        var now = function () {
          try { return performance.now(); } catch (_) { return 0; }
        };
        var state = { entries: [], done: false, dropped: 0 };
        globalThis.__MODOKI_EARLY_CONSOLE__ = state;
        var levels = ['log', 'info', 'warn', 'error'];
        for (var i = 0; i < levels.length; i++) {
          (function (lvl) {
            var real = console[lvl];
            if (typeof real !== 'function') return;
            console[lvl] = function () {
              if (!state.done) {
                // The timestamp is taken HERE, not at drain time. The ring stamps `mono` when it
                // records, so without this every buffered boot line would carry the DRAIN moment
                // and the boot-timing table this ring exists to produce (#591's nav+ms figures)
                // would be uniformly wrong while looking perfectly plausible.
                if (state.entries.length < CAP) state.entries.push([lvl, Array.prototype.slice.call(arguments), now()]);
                else state.dropped++;
              }
              return real.apply(console, arguments);
            };
          })(levels[i]);
        }
      })();
    </script>
    <!-- modoki:early-console:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
