# Public-repo CI — the engine-only gate: typecheck + lint + the app & engine test suites.
# No signing, no GPU, no Electron launch. This is the curated public counterpart of the private
# repo's ci.yml (docs/engine-oss-publishing.md): it drops the private-only game-project
# steps (there is no games/ here) and git-LFS fetch (the LFS-tracked skinned-test GLBs live with a
# game, so those tests skip). The root `npm ci` postinstall installs the MCP tool deps + builds the
# workspace plugins, so no separate tool/game install step is needed.
#
# ── WHY THIS RUNS WINDOWS, AND WHY IT RUNS *HERE* (#96) ─────────────────────────────────────────
# GitHub Actions is UNBILLED on standard runners for PUBLIC repositories — windows-latest included.
# Privately, Windows is the single most expensive leg (2x multiplier), which is why the private
# ci.yml is `workflow_dispatch`-only after the Actions budget was exhausted on 2026-07-31. So the
# economics invert: the coverage that costs ~47 billed minutes in the private repo is free here.
#
# And Windows is not a redundant leg. This repo has a recurring class of Windows-only path bugs —
# drive letters, separators, `/@fs/` URLs, POSIX-only assumptions like a ':'-joined PATH or
# `chmod 0600`, an fs path used as an ESM specifier — five such fixes in six months, EVERY one
# found by hand on the Windows clone because the gate could not see them. Most recently, Git's tar
# on Windows is GNU tar, not bsdtar: it cannot read zips and reads `C:\...` as a remote host, which
# silently broke ALL packaged toolchain provisioning while the smoke gate still passed.
#
# The code where that class lives (engine/scripts/**, engine/toolchain/**, path handling) is
# ENTIRELY inside this snapshot, so public coverage is real coverage rather than a proxy for it.
#
# ⚠️ Run logs here are WORLD-READABLE and permanent — including failure output and artifacts. The
# pre-publish safety scan covers SOURCE, not run output: a test that prints an env var or a
# machine-specific absolute path publishes it for good. Keep that in mind when adding a step.
#
# This is a SUBSET gate, not a replacement for the private one: no games/, no LFS. Anything
# game-dependent still has to run in the private repo. What it does buy that nothing else does is
# the Windows leg on every push, for free.

name: CI

on:
  pull_request:
  push:
    # `ci/**` is the CI-snapshot branch pushed by the private repo's oss-ci-snapshot.yml on every
    # push to private main (scripts/publish-engine-oss.sh --branch). Without it, a snapshot pushed
    # to a throwaway branch would trigger nothing at all and the whole mechanism would be silent.
    branches: [main, 'ci/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel the other OS on one failure — when a change breaks exactly one platform,
      # seeing BOTH results is the whole diagnostic signal.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # gate never launches Electron
    steps:
      # Deep node_modules nesting can exceed Windows' legacy 260-char MAX_PATH and fail the
      # checkout/install with confusing ENOENTs. Must precede checkout.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'   # Node 24 Active LTS — matches package.json engines + PINNED_NODE (the runtime the editor SHIPS)
          cache: npm

      - name: Install
        run: npm ci

      # The capacitor-* workspace packages ship their .d.ts / JS only in a gitignored dist/.
      # Build them AFTER install (rollup's native binary isn't linked yet during npm ci's
      # postinstall — npm bug #4828) so the app typecheck/tests can resolve them.
      - name: Build native plugin packages
        run: npm run build:plugins

      - name: Typecheck (app + engine)
        run: npm run typecheck

      # Linux only: lint is OS-invariant (the no-raw-fetch('/api/...') parity rule plus the usual
      # ESLint pass), so a second run buys nothing even when the minutes are free — it only adds
      # another place for the same failure to surface.
      - name: Lint (incl. the no-/api parity gate)
        if: runner.os == 'Linux'
        run: npm run lint

      - name: App tests
        run: npm test

      - name: Engine tests
        run: npm --prefix engine/packages/modoki test
